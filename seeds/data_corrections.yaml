instruction_backfills:
  Iron_Cross:
    - Stand tall with the arms extended out to the sides at shoulder height.
    - Brace the torso and hold the position without shrugging the shoulders.
    - Keep breathing steadily and stop if the shoulders or neck feel painful.
  One-Arm_Kettlebell_Swings:
    - Stand with the kettlebell slightly in front of you and hinge at the hips.
    - Swing the kettlebell back between the legs, then drive the hips forward to float it to chest height.
    - Keep the spine neutral, switch arms between sets, and use a light load until technique is consistent.
  Push_Press:
    - Start with the weight at shoulder height and feet about hip width apart.
    - Dip slightly through the knees, then drive upward with the legs and press the weight overhead.
    - Lower under control back to the shoulders and keep the ribs down throughout the movement.
  Side_Bridge:
    - Lie on one side with the elbow under the shoulder and legs stacked or staggered.
    - Lift the hips until the body forms a straight line from head to feet.
    - Hold the position while breathing steadily, then repeat on the other side.
  Side_Jackknife:
    - Lie on one side with the legs straight and one hand lightly supporting the head.
    - Lift the top leg and torso toward each other using the side abdominals.
    - Lower slowly and repeat before switching sides.
